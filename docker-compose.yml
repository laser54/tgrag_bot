services:
  # Pinggy SSH tunnel for HTTPS webhook
  pinggy:
    image: alpine:3.19
    entrypoint: /bin/sh
    command:
      - -c
      - |
        apk add --no-cache openssh-client > /dev/null 2>&1 &&
        PINGGY_HOST=$${PINGGY_TOKEN:+$$PINGGY_TOKEN@a.pinggy.io} &&
        PINGGY_HOST=$${PINGGY_HOST:-free.pinggy.io} &&
        echo "🚀 Connecting to Pinggy ($$PINGGY_HOST)..." &&
        ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 \
            -p 443 -R0:bot:8080 \
            $$PINGGY_HOST 2>&1 | tee /app/data/pinggy.log
    environment:
      - PINGGY_TOKEN=${PINGGY_TOKEN:-}
    networks:
      - tgrag-network
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    tty: true
    stdin_open: true

  # Main FastAPI application
  bot:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - ALLOWED_USER_IDS=${ALLOWED_USER_IDS}
      - QDRANT_URL=${QDRANT_URL:-}
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      - QDRANT_COLLECTION=${QDRANT_COLLECTION:-tgrag-bot}
      - USE_LOCAL_QDRANT=${USE_LOCAL_QDRANT:-false}
      - USE_PINGGY=true
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    networks:
      - tgrag-network
    depends_on:
      - pinggy
    restart: unless-stopped

  # Qdrant vector database
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - tgrag-network
    restart: unless-stopped
    profiles:
      - local-qdrant

  # Ollama for local LLM (optional)
  # ollama:
  #   image: ollama/ollama:latest
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   networks:
  #     - tgrag-network
  #   restart: unless-stopped

networks:
  tgrag-network:
    driver: bridge

volumes:
  qdrant_data:
  ollama_data:
