# Alembic configuration for the async SQLite data layer.
# The actual engine/url is resolved in apps/bot/db/migrations/env.py
# from DATABASE_URL (or the app settings), so the value below is a fallback only.

[alembic]
script_location = apps/bot/db/migrations
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url = sqlite+aiosqlite:///data/app.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
